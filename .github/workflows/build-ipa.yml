name: Build Husk IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: husk-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify JNI fix is present
        run: |
          git log -1 --oneline
          grep -q 'ensure_class_initialized' src/translation-layer-next/husk-tl-jni.c
          grep -q 'hook_ensure_init' src/translation-layer-next/husk-tl-dvm.c

      - name: Install build tools
        run: |
          brew update
          brew install meson ninja pkg-config autoconf automake libtool gettext xcodegen
          rustup target add aarch64-apple-ios

      # ci_build.sh runs every stage in the order the project needs:
      # deps -> ANGLE -> epoxy/virglrenderer -> QEMU -> integrate_husk ->
      # QEMU rebuild -> guest files -> MoltenVK -> rppairing -> IPA + TIPA.
      # QEMU is configured with --enable-opengl --enable-virglrenderer, so it
      # cannot be built before the GPU stack.
      - name: Build everything
        run: ./scripts/ci_build.sh "$GITHUB_WORKSPACE/Husk.ipa"

      - name: Show build failure details
        if: failure()
        shell: bash
        run: |
          for f in build/logs/*.log; do
            [ -f "$f" ] || continue
            echo "===== Last 150 lines of $f ====="
            tail -n 150 "$f"
          done

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Husk-build-logs-${{ github.sha }}
          path: build/logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload installable packages
        uses: actions/upload-artifact@v4
        with:
          name: Husk-${{ github.sha }}
          path: |
            Husk.ipa
            Husk.tipa
          if-no-files-found: error
          retention-days: 7
