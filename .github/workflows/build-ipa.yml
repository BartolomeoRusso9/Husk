name: Build Husk IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: husk-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify JNI fix is present
        run: |
          git log -1 --oneline
          grep -q 'ensure_class_initialized' src/translation-layer-next/husk-tl-jni.c
          grep -q 'hook_ensure_init' src/translation-layer-next/husk-tl-dvm.c

      - name: Install build tools
        run: |
          brew update
          brew install meson ninja pkg-config autoconf automake libtool gettext xcodegen
          rustup target add aarch64-apple-ios

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # java-runtime (libcore, ICU, conscrypt...) and android-system (CA certs,
      # fonts) come from an Android system image that is not in the repo; the
      # script takes them from the official release IPA and compiles
      # husk-framework.dex from this checkout. Without them the IPA installs but
      # Java apps cannot start and HTTPS fails.
      - name: Stage Java runtime, Android system files and PS4 layer
        run: ./scripts/stage_release_runtime.sh

      # ci_build.sh runs every stage in the order the project needs:
      # deps -> ANGLE -> epoxy/virglrenderer -> QEMU -> integrate_husk ->
      # QEMU rebuild -> guest files -> MoltenVK -> rppairing -> IPA + TIPA.
      # QEMU is configured with --enable-opengl --enable-virglrenderer, so it
      # cannot be built before the GPU stack.
      - name: Build everything
        run: ./scripts/ci_build.sh "$GITHUB_WORKSPACE/Husk.ipa"

      - name: Verify the IPA carries the Java runtime
        run: |
          unzip -Z1 Husk.ipa > ipa-files.txt
          grep -q 'java-runtime/husk-framework.dex$' ipa-files.txt
          grep -q 'java-runtime/com.android.art/javalib/core-oj.jar$' ipa-files.txt
          grep -q 'android-system/cacerts/' ipa-files.txt
          grep -q 'Frameworks/libhuskps4.dylib$' ipa-files.txt

      - name: Show build failure details
        if: failure()
        shell: bash
        run: |
          for f in build/logs/*.log; do
            [ -f "$f" ] || continue
            echo "===== Last 150 lines of $f ====="
            tail -n 150 "$f"
          done

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Husk-build-logs-${{ github.sha }}
          path: build/logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload installable packages
        uses: actions/upload-artifact@v4
        with:
          name: Husk-${{ github.sha }}
          path: |
            Husk.ipa
            Husk.tipa
          if-no-files-found: error
          retention-days: 7
